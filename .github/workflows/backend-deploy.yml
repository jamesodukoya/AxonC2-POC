name: Backend CI/CD to Oracle Cloud

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE: axonpoc-backend
  CONTAINER_NAME: axonpoc-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.ORACLE_VM_SSH_KEY }}

    - name: Add Oracle host to known_hosts
      env:
        ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
      run: ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

    - name: Setup workspace directory on server
      env:
        ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
        ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
      run: |
        ssh $ORACLE_USER@$ORACLE_HOST << 'SETUP_EOF'
        mkdir -p ~/AxonPOC/app
        sudo chown -R $(whoami):$(whoami) ~/AxonPOC/app
        SETUP_EOF

    - name: Sync project files to Oracle server
      env:
        ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
        ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
      run: |
        rsync -avz \
          -e "ssh" \
          backend/ \
          $ORACLE_USER@$ORACLE_HOST:~/AxonPOC/


    - name: Build and deploy container on Oracle
      env:
        ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
        ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
      run: |
        ssh $ORACLE_USER@$ORACLE_HOST << 'DEPLOY_EOF'
        set -e
        cd ~/AxonPOC
        
        if [ ! -f Dockerfile ]; then
          echo "ERROR: Dockerfile not found on server"
          exit 1
        fi
        
        # Fix workspace ownership for container user (UID 1000)
        sudo chown -R 1000:1000 ~/AxonPOC/app
        
        echo "Building Docker..."
        docker build \
          -f Dockerfile \
          -t axonpoc-backend:latest \
          --build-arg USERNAME=user \
          --build-arg USER_UID=1000 \
          --build-arg USER_GID=1000 \
          .
        
        docker stop axonpoc-backend 2>/dev/null || true
        docker rm axonpoc-backend 2>/dev/null || true
        
        echo "Launching container with persistent workspace volume..."
        docker run -d \
          --name axonpoc-backend \
          -v ~/AxonPOC/app:/home/user/app \
          --privileged \
          --network=host \
          axonpoc-backend:latest \
          sleep infinity

        echo "✓ Container deployment complete"
        DEPLOY_EOF
  
    
    - name: Verify deployment
      env:
        ORACLE_HOST: ${{ secrets.ORACLE_VM_HOST }}
        ORACLE_USER: ${{ secrets.ORACLE_VM_USER }}
      run: |
        ssh $ORACLE_USER@$ORACLE_HOST << 'VERIFY_EOF'
        
        echo ""
        echo "=================================="
        echo "  DEPLOYMENT VERIFICATION"
        echo "=================================="
        
        echo ""
        echo "=== Docker Container Status ==="
        docker ps | grep ${{ env.CONTAINER_NAME }}
        
        if docker ps | grep -q ${{ env.CONTAINER_NAME }}; then
          echo "✅ Container is running"
        else
          echo "❌ Container failed to start"
          docker logs ${{ env.CONTAINER_NAME }}
          exit 1
        fi
        
        echo ""
        echo "=== Health Check ==="
        curl -f http://localhost:5000/ || { echo "❌ Health check failed!"; exit 1; }
        echo "✅ Backend API is healthy"
        
        
        echo ""
        echo "=== Process Status ==="
        BACKEND_COUNT=$(docker exec ${{ env.CONTAINER_NAME }} bash -c "ps aux | grep 'python3 app.py' | grep -v grep | wc -l" || echo "0")
        COMMANDER_COUNT=$(docker exec ${{ env.CONTAINER_NAME }} bash -c "ps aux | grep 'python3 commander.py' | grep -v grep | wc -l" || echo "0")
        echo "Backend processes: $BACKEND_COUNT"
        echo "Commander processes: $COMMANDER_COUNT"
        
        if [ "$BACKEND_COUNT" -gt 0 ]; then
          echo "✅ Backend (app.py) is running"
        else
          echo "⚠️ Backend (app.py) not detected"
        fi
        
        if [ "$COMMANDER_COUNT" -gt 0 ]; then
          echo "✅ Commander is running"
        else
          echo "⚠️ Commander not detected"
        fi
        
        echo ""
        echo "=== Recent Logs (last 10 lines) ==="
        docker logs --tail 10 ${{ env.CONTAINER_NAME }}
        
        echo ""
        echo "=================================="
        echo "  ✅ DEPLOYMENT COMPLETE"
        echo "=================================="
        echo ""
        echo "Monitor logs:"
        echo "  docker logs -f ${{ env.CONTAINER_NAME }}"
        echo ""
        echo "Check supervisord status:"
        echo "  docker exec ${{ env.CONTAINER_NAME }} supervisorctl status"
        echo ""
        
        VERIFY_EOF
    
    - name: Deployment Status Notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to Oracle Cloud successful!"
        else
          echo "❌ Deployment to Oracle Cloud failed!"
        fi

  cleanup:
    name: Cleanup Old Deployments
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: SSH to Oracle VM and cleanup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ORACLE_VM_HOST }}
        username: ${{ secrets.ORACLE_VM_USER }}
        key: ${{ secrets.ORACLE_VM_SSH_KEY }}
        port: 22
        script: |
          echo "=== Cleaning up old Docker resources ==="
          
          # Remove dangling images
          docker image prune -f
          
          # Remove stopped containers older than 24 hours
          docker container prune -f --filter "until=24h"
          
          # Show disk usage
          echo "Current disk usage:"
          df -h /
          
          echo "Docker disk usage:"
          docker system df
          
          echo "=== Cleanup completed ==="