name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Deploy to Oracle Cloud
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.ORACLE_VM_HOST }}
        username: ${{ secrets.ORACLE_VM_USER }}
        key: ${{ secrets.ORACLE_VM_SSH_KEY }}
        script: |
          cd ~/AxonPOC
          git pull origin main
          cd backend
          docker build -t axonpoc-backend:latest .
          docker stop axonpoc-backend || true
          docker rm axonpoc-backend || true
          docker run -d \
            --name axonpoc-backend \
            --network host \
            --restart unless-stopped \
            -v $(pwd)/logs:/app/logs \
            axonpoc-backend:latest
          docker ps | grep axonpoc-backend