name: Backend CI/CD to Oracle Cloud

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE: axonpoc-backend
  CONTAINER_NAME: axonpoc-backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      working-directory: backend
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      working-directory: backend
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
        docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
    
    - name: Test Docker image
      run: |
        docker run --rm ${{ env.DOCKER_IMAGE }}:latest python --version
        docker run --rm ${{ env.DOCKER_IMAGE }}:latest pip list

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Oracle VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ORACLE_VM_HOST }}
        username: ${{ secrets.ORACLE_VM_USER }}
        key: ${{ secrets.ORACLE_VM_SSH_KEY }}
        port: 22
        script: |
          set -e
          
          echo "=== Starting deployment ==="
          
          # Navigate to project directory
          cd ~/AxonPOC || { echo "Project directory not found!"; exit 1; }
          
          # Pull latest code
          echo "Pulling latest code from GitHub..."
          git fetch origin
          git reset --hard origin/main
          
          # Navigate to backend directory
          cd backend
          
          # Build new Docker image
          echo "Building Docker image..."
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          
          # Stop existing container gracefully
          echo "Stopping existing container..."
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          
          # Start new container with supervisord
          echo "Starting new container with supervisord..."
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --network host \
            --restart unless-stopped \
            -v $(pwd)/logs:/app/logs \
            -e PYTHONUNBUFFERED=1 \
            ${{ env.DOCKER_IMAGE }}:latest
          
          # Wait for services to start
          echo "Waiting for services to initialize (30 seconds)..."
          sleep 30
          
          # Verify container is running
          if docker ps | grep -q ${{ env.CONTAINER_NAME }}; then
            echo "✅ Container is running"
            docker ps | grep ${{ env.CONTAINER_NAME }}
          else
            echo "❌ Container failed to start"
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1
          fi
          
          # Health check
          echo "Running health check..."
          curl -f http://localhost:5000/ || { echo "❌ Health check failed!"; exit 1; }
          echo "✅ Backend API is healthy"
          
          # Verify supervisord is managing processes
          echo "Checking supervisord status..."
          docker exec ${{ env.CONTAINER_NAME }} supervisorctl status || echo "⚠️ Warning: Could not get supervisor status"
          
          # Verify both processes are running
          echo "Verifying processes..."
          docker exec ${{ env.CONTAINER_NAME }} pgrep -f "python3 app.py" || echo "⚠️ Warning: app.py process not found"
          docker exec ${{ env.CONTAINER_NAME }} pgrep -f "python3 commander.py" || echo "⚠️ Warning: commander.py process not found"
          
          echo "✅ Deployment completed - Supervisord is managing processes with auto-restart"
          
          echo "=== Deployment completed successfully ==="
          
          # Clean up old images
          echo "Cleaning up old Docker images..."
          docker image prune -af --filter "until=24h" || true
          
          echo "=== Final status ==="
          docker ps | grep ${{ env.CONTAINER_NAME }}
          docker logs --tail=20 ${{ env.CONTAINER_NAME }}
    
    - name: Deployment Status Notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to Oracle Cloud successful!"
        else
          echo "❌ Deployment to Oracle Cloud failed!"
        fi

  cleanup:
    name: Cleanup Old Deployments
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: SSH to Oracle VM and cleanup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ORACLE_VM_HOST }}
        username: ${{ secrets.ORACLE_VM_USER }}
        key: ${{ secrets.ORACLE_VM_SSH_KEY }}
        port: 22
        script: |
          echo "=== Cleaning up old Docker resources ==="
          
          # Remove dangling images
          docker image prune -f
          
          # Remove stopped containers older than 24 hours
          docker container prune -f --filter "until=24h"
          
          # Show disk usage
          echo "Current disk usage:"
          df -h /
          
          echo "Docker disk usage:"
          docker system df
          
          echo "=== Cleanup completed ==="