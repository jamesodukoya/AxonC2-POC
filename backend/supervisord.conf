# Supervisord configuration for AxonPOC Backend
# Manages app.py and commander.py with auto-restart

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
command=python3 /app/app.py
directory=/app
autostart=true
autorestart=true
startretries=3
user=appuser
stdout_logfile=/app/logs/backend.log
stderr_logfile=/app/logs/backend.error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[program:commander]
command=python3 /app/commander.py
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=30
user=appuser
stdout_logfile=/app/logs/commander.log
stderr_logfile=/app/logs/commander.error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
# Wait for backend to start first
priority=999

[group:axonpoc]
programs=backend,commander
priority=999