[supervisord]
nodaemon=true
user=user
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[program:flask]
command=python3 app.py
directory=/home/user/app
user=user
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/flask.log
stderr_logfile=/var/log/supervisor/flask_error.log
priority=10

[program:commander_starter]
command=/home/user/start_commander.sh
user=user
autostart=true
autorestart=false
startsecs=0
startretries=1
stdout_logfile=/var/log/supervisor/commander_starter.log
stderr_logfile=/var/log/supervisor/commander_starter_error.log
priority=20

[program:commander]
command=python3 commander.py
directory=/home/user/app
user=user
autostart=false
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/commander.log
stderr_logfile=/var/log/supervisor/commander_error.log
priority=30
