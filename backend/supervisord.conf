[supervisord]
nodaemon=true
user=user
logfile=/home/user/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/home/user/logs

[program:flask]
command=python3 app.py
directory=/home/user
user=user
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/home/user/logs/flask.log
stderr_logfile=/home/user/logs/flask_error.log
priority=10
environment=FLASK_APP="app.py",FLASK_ENV="production"

[program:commander_starter]
command=/home/user/start_commander.sh
user=user
autostart=true
autorestart=false
startsecs=0
startretries=1
stdout_logfile=/home/user/logs/commander_starter.log
stderr_logfile=/home/user/logs/commander_starter_error.log
priority=20

[program:commander]
command=python3 commander.py
directory=/home/user
user=user
autostart=false
autorestart=true
startsecs=10
stdout_logfile=/home/user/logs/commander.log
stderr_logfile=/home/user/logs/commander_error.log
priority=30